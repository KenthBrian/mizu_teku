<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuTeku - Sign In / Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
<script src="script.js"></script>
<style>
  /* ===== Full-page container ===== */
  body {
    margin: 0;
    padding: 0;
    font-family: 'Chewy', sans-serif;
    background-color: #f8fbff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .login-container {
    background: rgba(255, 255, 255, 0.95);
    padding: 2rem 2.5rem;
    border-radius: 25px;
    text-align: center;
    width: 420px;
    max-width: 90%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  .login-container h2 {
    color: #3498db;
    margin-bottom: 0.5rem;
    font-size: 1.7rem;
  }

  .login-container p {
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }

  /* ===== Inputs ===== */
  .login-container input[type="text"],
  .login-container input[type="password"],
  .login-container input[type="email"] {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border: 2px solid #3498db;
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
    transition: border 0.3s ease, box-shadow 0.3s ease;
    box-sizing: border-box;
  }

  .login-container input:focus {
    border-color: #2ecc71;
    box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
  }

  /* ===== Buttons ===== */
  #saveUsername {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #3498db, #2ecc71);
    color: white;
    border: none;
    padding: 0.8rem;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
    margin-bottom: 0.8rem;
  }

  #saveUsername:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
  }

  .toggle-link {
    color: #3498db;
    cursor: pointer;
    font-weight: bold;
    text-decoration: underline;
  }

  /* Fade & slide animation for form fields */
  .fade-slide {
    opacity: 0;
    transform: translateY(-20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .fade-slide.show {
    opacity: 1;
    transform: translateY(0);
  }

    /* Optional: animate the button too */
  #saveUsername {
    transition: all 0.4s ease;
  }
</style>
</head>
<body>

<div class="login-container">
  <h2 id="formTitle">MizuTeku Sign In</h2>
  <p id="formDesc">Please enter your email and password:</p>

  <!-- Sign Up Fields (hidden by default) -->
  <input type="text" id="lastnameInput" placeholder="Enter your last name" style="display:none">
  <input type="text" id="firstnameInput" placeholder="Enter your first name" style="display:none">
  <input type="text" id="middleinitialInput" placeholder="Enter your middle initial" style="display:none">

  <!-- Common Fields -->
  <input type="email" id="emailInput" placeholder="Enter your email">
  <input type="password" id="passwordInput" placeholder="Enter your password">
  <input type="password" id="confirmPasswordInput" placeholder="Confirm your password" style="display:none">

  <button id="saveUsername">Sign In</button>

  <p style="margin-top:10px;" id="switchText">
    Don't have an account? <span class="toggle-link" id="toggleForm">Sign Up</span>
  </p>
</div>

<script type="module">
import { 
  initializeApp 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import { 
  getAuth, 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword, 
  onAuthStateChanged, 
  setPersistence, 
  browserSessionPersistence 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import { 
  getFirestore, 
  doc, 
  setDoc, 
  getDoc, 
  serverTimestamp, 
  collection, 
  addDoc 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// --- Firebase Config ---
const firebaseConfig = {
  apiKey: "AIzaSyDMMt2XLZMsHftcdHnls2KrIqG-b2-eY0c",
  authDomain: "mizuteku-3a441.firebaseapp.com",
  projectId: "mizuteku-3a441",
  storageBucket: "mizuteku-3a441.firebasestorage.app",
  messagingSenderId: "473895456413",
  appId: "1:473895456413:web:1452ef7b9860908dd78e74",
  measurementId: "G-NTT38FCEKG",
};

// --- Initialize Firebase ---
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// --- Elements ---
const loginBtn = document.getElementById("saveUsername");
const toggleLink = document.getElementById("toggleForm");
const switchText = document.getElementById("switchText");
const formTitle = document.getElementById("formTitle");
const formDesc = document.getElementById("formDesc");

// --- Inputs ---
const lastnameInput = document.getElementById("lastnameInput");
const firstnameInput = document.getElementById("firstnameInput");
const middleinitialInput = document.getElementById("middleinitialInput");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const confirmPasswordInput = document.getElementById("confirmPasswordInput");

let isSignUpMode = false;

// --- Toggle Between Sign In / Sign Up ---
toggleLink.addEventListener("click", () => {
  isSignUpMode = !isSignUpMode;

  if (isSignUpMode) {
    formTitle.textContent = "MizuTeku Sign Up";
    formDesc.textContent = "Please enter your details to create an account:";
    lastnameInput.style.display = "block";
    firstnameInput.style.display = "block";
    middleinitialInput.style.display = "block";
    confirmPasswordInput.style.display = "block";
    loginBtn.textContent = "Sign Up";
    toggleLink.textContent = "Sign In";
    switchText.firstChild.textContent = "Already have an account? ";
  } else {
    formTitle.textContent = "MizuTeku Sign In";
    formDesc.textContent = "Please enter your email and password:";
    lastnameInput.style.display = "none";
    firstnameInput.style.display = "none";
    middleinitialInput.style.display = "none";
    confirmPasswordInput.style.display = "none";
    loginBtn.textContent = "Sign In";
    toggleLink.textContent = "Sign Up";
    switchText.firstChild.textContent = "Don't have an account? ";
  }
});

// --- Handle Sign In / Sign Up ---
loginBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (isSignUpMode) {
    const lastName = lastnameInput.value.trim();
    const firstName = firstnameInput.value.trim();
    const middleInitial = middleinitialInput.value.trim();
    const confirmPassword = confirmPasswordInput.value.trim();

    if (!lastName || !firstName || !email || !password) {
      alert("⚠️ Please fill in all required fields!");
      return;
    }

    if (password !== confirmPassword) {
      alert("⚠️ Passwords do not match!");
      return;
    }

    try {
      // Create user
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Save student data
      await setDoc(doc(collection(db, "verificationRequests")), {
        studentId: user.uid,
        firstName: firstName,
        middleInitial: middleInitial,
        lastName: lastName,
        status: "pending",
        createdAt: new Date()
      });

      // --- Send verification request to teacher collection ---
      await addDoc(collection(db, "verificationRequests"), {
        studentId: user.uid,
        lastName,
        firstName,
        middleInitial,
        email,
        status: "pending",
        requestedAt: serverTimestamp(),
      });

      alert("✅ Sign-up successful! Your verification request has been sent to the teacher.");
      toggleLink.click(); // Switch to Sign In
    } catch (err) {
      alert("❌ " + err.message);
    }
  } else {
    // --- Sign In Logic ---
    if (!email || !password) {
      alert("⚠️ Please enter your email and password.");
      return;
    }

    try {
      await setPersistence(auth, browserSessionPersistence);
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      if (email === "mizutekuteacher@gmail.com") {
        window.location.href = "teacher.html";
        return;
      }

      const studentDoc = await getDoc(doc(db, "students", user.uid));
      if (studentDoc.exists()) {
        const data = studentDoc.data();
        if (data.verified) {
          window.location.href = "student.html";
        } else {
          alert("⏳ Your account is still waiting for teacher verification.");
        }
      } else {
        alert("❌ Student record not found!");
      }
    } catch (err) {
      alert("❌ " + err.message);
    }
  }
});

// --- Auto redirect if already logged in ---
onAuthStateChanged(auth, async (user) => {
  if (user) {
    if (user.email === "mizutekuteacher@gmail.com") {
      window.location.href = "teacher.html";
    } else {
      const studentDoc = await getDoc(doc(db, "students", user.uid));
      if (studentDoc.exists()) {
        const data = studentDoc.data();
        if (data.verified) {
          window.location.href = "student.html";
        }
      }
    }
  }
});
</script>
</body>
</html>
