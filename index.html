<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuTeku - Sign In / Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Chewy', sans-serif;
    background-color: #f8fbff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  #bgLayer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    bottom: -100px;
    border-radius: 50%;
    opacity: 0.6;
    animation: rise linear infinite;
    cursor: pointer;
  }

  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0.6; }
    50% { opacity: 0.8; }
    100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
  }

  .bubble.pop { animation: pop 0.3s forwards !important; }

  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }

  .login-container {
    background: rgba(255, 255, 255, 0.95);
    padding: 2rem 2.5rem;
    border-radius: 25px;
    text-align: center;
    width: 420px;
    max-width: 90%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  .login-container h2 {
    color: #3498db;
    margin-bottom: 0.5rem;
    font-size: 1.7rem;
  }

  .login-container p {
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }

  .login-container input[type="text"],
  .login-container input[type="password"],
  .login-container input[type="email"],
  .login-container select {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border: 2px solid #3498db;
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
    transition: border 0.3s ease, box-shadow 0.3s ease;
    box-sizing: border-box;
  }

  .login-container input:focus,
  .login-container select:focus {
    border-color: #2ecc71;
    box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
  }

  .login-container button {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #3498db, #2ecc71);
    color: white;
    border: none;
    padding: 0.8rem;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
    margin-bottom: 0.8rem;
  }

  .login-container button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
  }

  .toggle-link {
    color: #3498db;
    cursor: pointer;
    font-weight: bold;
    text-decoration: underline;
  }

  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-wrapper input {
    width: 100%;
    padding-right: 2.8rem;
    height: 2.8rem;
  }

  .password-wrapper .toggle-password {
    position: absolute;
    right: 10px;
    top: 40%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 1.2rem;
    color: #3498db;
    user-select: none;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .row input, .row select { flex: 1; }

  #nameRow input#lastnameInput { flex: 2; }
  #nameRow input#firstnameInput { flex: 2; }
  #nameRow input#middleinitialInput { flex: 1; }

  #lrnRow, #nameRow, #gradeRow { display: none; }

  .modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

.modal-content {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 320px;
  text-align: center;
  animation: pop 0.3s ease;
}

@keyframes pop {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.modal-content button {
  margin-top: 15px;
  background: #007bff;
  border: none;
  color: white;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
}
.modal-content button:hover {
  background: #005ec7;
}
  
</style>
</head>
<body>
  <div id="verifyModal" class="modal">
    <div class="modal-content">
      <h3>✅ Account Created!</h3>
      <p>Your verification request has been sent.<br>
      Please wait for approval.</p>
      <button id="closeVerifyModal">Okay</button>
    </div>
  </div>

  <div id="bgLayer"></div>

  <div class="login-container">
    <h2 id="formTitle">MizuTeku Sign In</h2>
    <p id="formDesc">Please enter your email and password:</p>

    <!-- Sign Up Role Selection -->
    <div class="row" id="roleRow" style="display:none;">
      <select id="roleSelect">
        <option value="" disabled selected>Select Role</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>
    </div>

    <!-- STUDENT ONLY FIELD -->
    <div class="row" id="lrnRow" style="display:none;">
      <input type="text" id="lrnInput" placeholder="LRN (12 digits)">
    </div>

    <!-- SHARED NAME FIELDS -->
    <div class="row" id="nameRow" style="display:none;">
      <input type="text" id="lastnameInput" placeholder="Last Name">
      <input type="text" id="firstnameInput" placeholder="First Name">
      <input type="text" id="middleinitialInput" placeholder="M.I.">
    </div>

    <!-- SHARED ADVISORY / SECTION FIELDS -->
    <div class="row" id="gradeRow" style="display:none;">
    <select id="gradeSelect">
      <option value="" disabled selected>Grade</option>
      <option value="1">Grade 1</option>
      <option value="2">Grade 2</option>
      <option value="3">Grade 3</option>
    </select>
    <input type="text" id="sectionInput" placeholder="Section (Ex. Diamond)">
  </div>

    <!-- COMMON EMAIL -->
    <input type="email" id="emailInput" placeholder="Enter your email">

    <!-- PASSWORD -->
    <div class="password-wrapper">
      <input type="password" id="passwordInput" placeholder="Enter your password">
      <span class="toggle-password" id="togglePassword"><i class="fa-solid fa-eye"></i></span>
    </div>

    <!-- CONFIRM PASSWORD (SIGN UP ONLY) -->
    <div class="password-wrapper" id="confirmWrapper" style="display:none;">
      <input type="password" id="confirmPasswordInput" placeholder="Confirm your password">
      <span class="toggle-password" id="toggleConfirm"><i class="fa-solid fa-eye"></i></span>
    </div>

    <button id="saveUsername">Sign In</button>

    <p id="switchText">
      Don't have an account? <span class="toggle-link" id="toggleForm">Sign Up</span>
    </p>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  onAuthStateChanged, setPersistence, browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, collection, addDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMMt2XLZMsHftcdHnls2KrIqG-b2-eY0c",
  authDomain: "mizuteku-3a441.firebaseapp.com",
  projectId: "mizuteku-3a441",
  storageBucket: "mizuteku-3a441.firebasestorage.app",
  messagingSenderId: "473895456413",
  appId: "1:473895456413:web:1452ef7b9860908dd78e74",
  measurementId: "G-NTT38FCEKG",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Elements
const toggleLink = document.getElementById("toggleForm");
const loginBtn = document.getElementById("saveUsername");
const formTitle = document.getElementById("formTitle");
const formDesc = document.getElementById("formDesc");
const confirmWrapper = document.getElementById("confirmPasswordInput").parentElement;

const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const confirmPasswordInput = document.getElementById("confirmPasswordInput");

const roleRow = document.getElementById("roleRow");
const roleSelect = document.getElementById("roleSelect");

const lrnRow = document.getElementById("lrnRow");
const nameRow = document.getElementById("nameRow");
const gradeRow = document.getElementById("gradeRow");

const lrnInput = document.getElementById("lrnInput");
const lastnameInput = document.getElementById("lastnameInput");
const firstnameInput = document.getElementById("firstnameInput");
const middleinitialInput = document.getElementById("middleinitialInput");
const gradeSelect = document.getElementById("gradeSelect");
const sectionInput = document.getElementById("sectionInput");

const verifyModal = document.getElementById("verifyModal");
document.getElementById("closeVerifyModal").onclick = () => verifyModal.style.display = "none";

let isSignUpMode = false;

// INPUT FILTERS
lrnInput.addEventListener("input", () => lrnInput.value = lrnInput.value.replace(/\D/g, "").slice(0, 12));
firstnameInput.addEventListener("input", () => {firstnameInput.value = firstnameInput.value.replace(/[^A-Za-z\s-]/g, "");});
lastnameInput.addEventListener("input", () => lastnameInput.value = lastnameInput.value.replace(/[^A-Za-z\s]/g, ""));
middleinitialInput.addEventListener("input", () => middleinitialInput.value = middleinitialInput.value.replace(/[^A-Za-z]/g, "").toUpperCase().slice(0, 1));
sectionInput.addEventListener("input", () => sectionInput.value = sectionInput.value.replace(/[^A-Za-z0-9]/g, ""));

// Toggle Sign Up / Sign In
toggleLink.addEventListener("click", () => {
  isSignUpMode = !isSignUpMode;

  formTitle.textContent = isSignUpMode ? "MizuTeku Sign Up" : "MizuTeku Sign In";
  formDesc.textContent = isSignUpMode ? "Create an account:" : "Please enter your credentials:";
  loginBtn.textContent = isSignUpMode ? "Create Account" : "Sign In";
  toggleLink.textContent = isSignUpMode ? "Sign In" : "Sign Up";

  confirmWrapper.style.display = isSignUpMode ? "flex" : "none";
  roleRow.style.display = isSignUpMode ? "flex" : "none";

  if (isSignUpMode) {
    roleSelect.value = "student";
    lrnRow.style.display = "flex";
    nameRow.style.display = "flex";
    gradeRow.style.display = "flex";
  } else {
    lrnRow.style.display = "none";
    nameRow.style.display = "none";
    gradeRow.style.display = "none";
  }
});

// Role Selection Fields
roleSelect.addEventListener("change", () => {
  const role = roleSelect.value;

  if (role === "student") {
    lrnRow.style.display = "flex";
    nameRow.style.display = "flex";
    gradeRow.style.display = "flex";

    gradeSelect.options[0].textContent = "Grade (1-3)";
    sectionInput.placeholder = "Section (e.g. Diamond)";
  }

  if (role === "teacher") {
    lrnRow.style.display = "none";
    nameRow.style.display = "flex";
    gradeRow.style.display = "flex";

    gradeSelect.options[0].textContent = "Advisory Grade";
    sectionInput.placeholder = "Advisory Section";
  }
});

// Handle Auth
async function handleAuth() {

  if (isSignUpMode) {

    // ✅ TEACHER SIGN UP → SEND TO teacherVerificationRequests
    if (roleSelect.value === "teacher") {

      if (!lastnameInput.value || !firstnameInput.value || !gradeSelect.value || !sectionInput.value) {
        return alert("Please fill all teacher information.");
      }

      if (passwordInput.value !== confirmPasswordInput.value) {
        confirmPasswordInput.setCustomValidity("Passwords do not match.");
        confirmPasswordInput.reportValidity();
        return;
      }

      const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);

      await setDoc(doc(db, "teacherVerificationRequests", userCredential.user.uid), {
        teacherId: userCredential.user.uid,
        lastName: lastnameInput.value,
        firstName: firstnameInput.value,
        middleInitial: middleinitialInput.value,
        advisoryGrade: gradeSelect.value,
        advisorySection: sectionInput.value,
        email: emailInput.value,
        status: "pending",
        requestedAt: serverTimestamp(),
      });

      verifyModal.style.display = "flex";
      return;
    }

    // ✅ STUDENT SIGN UP (same as before)
    if (!/^[0-9]{12}$/.test(lrnInput.value)) {
      lrnInput.setCustomValidity("LRN must be exactly 12 digits.");
      lrnInput.reportValidity();
      return;
    }

    if (passwordInput.value !== confirmPasswordInput.value) {
      confirmPasswordInput.setCustomValidity("Passwords do not match.");
      confirmPasswordInput.reportValidity();
      return;
    }

    const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);

    await addDoc(collection(db, "verificationRequests"), {
      studentId: userCredential.user.uid,
      lrn: lrnInput.value,
      lastName: lastnameInput.value,
      firstName: firstnameInput.value,
      middleInitial: middleinitialInput.value,
      grade: gradeSelect.value,
      section: sectionInput.value,
      email: emailInput.value,
      status: "pending",
      requestedAt: serverTimestamp(),
    });

    verifyModal.style.display = "flex";
    return;
  }

  // ✅ SIGN IN
// ✅ SIGN IN
await setPersistence(auth, browserSessionPersistence);
const { user } = await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);

// --- TEACHER LOGIN CHECK ---
const teacherDoc = await getDoc(doc(db, "teachers", user.uid));
if (teacherDoc.exists()) {
  if (teacherDoc.data().verified === true) {
    return window.location.href = "teacher.html"; // ✅ Approved Teacher
  } else {
    passwordInput.setCustomValidity("Your teacher account is still pending admin verification.");
    passwordInput.reportValidity();
    return;
  }
}

// --- STUDENT LOGIN CHECK ---
const studentDoc = await getDoc(doc(db, "students", user.uid));
if (studentDoc.exists()) {
  if (studentDoc.data().verified === true) {
    return window.location.href = "student.html"; // ✅ Approved Student
  } else {
    passwordInput.setCustomValidity("Your student account is still pending verification.");
    passwordInput.reportValidity();
    return;
  }
}

// If neither student nor teacher exists:
passwordInput.setCustomValidity("Your account is not yet processed by admin.");
passwordInput.reportValidity();
}

loginBtn.addEventListener("click", handleAuth);
</script>
</body>
</html>
