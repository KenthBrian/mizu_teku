<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuTeku - Sign In / Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
<style>
  /* ===== Full-page container ===== */
  body {
    margin: 0;
    padding: 0;
    font-family: 'Chewy', sans-serif;
    background-color: #f8fbff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== Bubble Layer ===== */
  #bgLayer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    bottom: -100px;
    border-radius: 50%;
    opacity: 0.6;
    animation: rise linear infinite;
    cursor: pointer;
  }

  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0.6; }
    50% { opacity: 0.8; }
    100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
  }

  .bubble.pop {
    animation: pop 0.3s forwards !important;
  }

  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* ===== Login Form ===== */
  .login-container {
    background: rgba(255, 255, 255, 0.95);
    padding: 2rem 2.5rem;
    border-radius: 25px;
    text-align: center;
    width: 420px;
    max-width: 90%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  .login-container h2 {
    color: #3498db;
    margin-bottom: 0.5rem;
    font-size: 1.7rem;
  }

  .login-container p {
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }

  .login-container input[type="text"],
  .login-container input[type="password"],
  .login-container input[type="email"],
  .login-container select {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border: 2px solid #3498db;
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
    transition: border 0.3s ease, box-shadow 0.3s ease;
    box-sizing: border-box;
  }

  .login-container input:focus,
  .login-container select:focus {
    border-color: #2ecc71;
    box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
  }

  .login-container button {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #3498db, #2ecc71);
    color: white;
    border: none;
    padding: 0.8rem;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
    margin-bottom: 0.8rem;
  }

  .login-container button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
  }

  .toggle-link {
    color: #3498db;
    cursor: pointer;
    font-weight: bold;
    text-decoration: underline;
  }

  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-wrapper input {
    width: 100%;
    padding-right: 2.8rem;
    height: 2.8rem;
    box-sizing: border-box;
  }

  .password-wrapper .toggle-password {
    position: absolute;
    right: 10px;
    top: 40%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 1.2rem;
    color: #3498db;
    user-select: none;
  }

  #loadingOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .spinner {
    border: 6px solid #f3f3f3;
    border-top: 6px solid #2196F3;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* ===== Flex Rows for Compact Sign-Up ===== */
  .row {
    display: flex;
    gap: 10px;
  }

  .row input,
  .row select {
    flex: 1;
  }

  #nameRow input#lastnameInput {
    flex: 2;
  }

  #nameRow input#firstnameInput {
    flex: 2;
  }

  #nameRow input#middleinitialInput {
    flex: 1;
  }

  #gradeRow select#gradeSelect {
    flex: 1;
  }

  #gradeRow input#sectionInput {
    flex: 1;
  }

  #nameRow, #gradeRow {
    display: none; /* JS toggle will show */
  }
</style>
</head>
<body data-page="login">

<div id="bgLayer"></div>

<div id="loadingOverlay" style="display: none;">
  <div class="spinner"></div>
</div>

<div class="login-container">
  <h2 id="formTitle">MizuTeku Sign In</h2>
  <p id="formDesc">Please enter your email and password:</p>

  <!-- Sign-Up Rows -->
  <div class="row" id="nameRow">
    <input type="text" id="lastnameInput" placeholder="Last Name">
    <input type="text" id="firstnameInput" placeholder="First Name">
    <input type="text" id="middleinitialInput" placeholder="M.I.">
  </div>

  <div class="row" id="gradeRow">
    <select id="gradeSelect">
      <option value="" disabled selected>Grade</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>
    <input type="text" id="sectionInput" placeholder="Section">
  </div>

  <!-- Sign-In Fields -->
  <input type="email" id="emailInput" placeholder="Enter your email">

  <div class="password-wrapper">
    <input type="password" id="passwordInput" placeholder="Enter your password">
    <span class="toggle-password" id="togglePassword"><i class="fa-solid fa-eye"></i></span>
  </div>

  <div class="password-wrapper" style="display:none;" id="confirmWrapper">
    <input type="password" id="confirmPasswordInput" placeholder="Confirm your password">
    <span class="toggle-password" id="toggleConfirm"><i class="fa-solid fa-eye"></i></span>
  </div>

  <button id="saveUsername">Sign In</button>

  <p style="margin-top:10px;" id="switchText">
    Don't have an account? <span class="toggle-link" id="toggleForm">Sign Up</span>
  </p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  onAuthStateChanged, setPersistence, browserSessionPersistence 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { 
  getFirestore, doc, getDoc, serverTimestamp, collection, addDoc 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// --- Firebase Config ---
const firebaseConfig = {
  apiKey: "AIzaSyDMMt2XLZMsHftcdHnls2KrIqG-b2-eY0c",
  authDomain: "mizuteku-3a441.firebaseapp.com",
  projectId: "mizuteku-3a441",
  storageBucket: "mizuteku-3a441.firebasestorage.app",
  messagingSenderId: "473895456413",
  appId: "1:473895456413:web:1452ef7b9860908dd78e74",
  measurementId: "G-NTT38FCEKG",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// --- Elements ---
const loginBtn = document.getElementById("saveUsername");
const toggleLink = document.getElementById("toggleForm");
const switchText = document.getElementById("switchText");
const formTitle = document.getElementById("formTitle");
const formDesc = document.getElementById("formDesc");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const confirmPasswordInput = document.getElementById("confirmPasswordInput");
const confirmWrapper = document.getElementById("confirmWrapper");
const togglePassword = document.getElementById("togglePassword");
const toggleConfirm = document.getElementById("toggleConfirm");
const bgLayer = document.getElementById("bgLayer");

const nameRow = document.getElementById("nameRow");
const gradeRow = document.getElementById("gradeRow");
const lastnameInput = document.getElementById("lastnameInput");
const firstnameInput = document.getElementById("firstnameInput");
const middleinitialInput = document.getElementById("middleinitialInput");
const gradeSelect = document.getElementById("gradeSelect");
const sectionInput = document.getElementById("sectionInput");

let isSignUpMode = false;

// --- Toggle Sign In / Sign Up ---
toggleLink.addEventListener("click", () => {
  isSignUpMode = !isSignUpMode;
  if (isSignUpMode) {
    formTitle.textContent = "MizuTeku Sign Up";
    formDesc.textContent = "Please enter your details to create an account:";
    nameRow.style.display = "flex";
    gradeRow.style.display = "flex";
    confirmWrapper.style.display = "flex";
    loginBtn.textContent = "Sign Up";
    toggleLink.textContent = "Sign In";
    switchText.firstChild.textContent = "Already have an account? ";
  } else {
    formTitle.textContent = "MizuTeku Sign In";
    formDesc.textContent = "Please enter your email and password:";
    nameRow.style.display = "none";
    gradeRow.style.display = "none";
    confirmWrapper.style.display = "none";
    loginBtn.textContent = "Sign In";
    toggleLink.textContent = "Sign Up";
    switchText.firstChild.textContent = "Don't have an account? ";
  }
});

// --- Auth Handler ---
async function handleAuth() {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (isSignUpMode) {
    const lastName = lastnameInput.value.trim();
    const firstName = firstnameInput.value.trim();
    const middleInitial = middleinitialInput.value.trim();
    const grade = gradeSelect.value;
    const section = sectionInput.value.trim();
    const confirmPassword = confirmPasswordInput.value.trim();

    if (!lastName || !firstName || !email || !password || !section || !grade) {
      alert("⚠️ Please fill in all required fields!");
      return;
    }
    if (password !== confirmPassword) {
      alert("⚠️ Passwords do not match!");
      return;
    }

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      await addDoc(collection(db, "verificationRequests"), {
        studentId: user.uid,
        lastName,
        firstName,
        middleInitial,
        grade,
        section,
        email,
        status: "pending",
        requestedAt: serverTimestamp(),
      });

      alert("✅ Sign-up successful! Your verification request has been sent to the teacher.");
      toggleLink.click();
    } catch (err) {
      alert("❌ " + err.message);
    }

  } else {
    if (!email || !password) {
      alert("⚠️ Please enter your email and password.");
      return;
    }

    try {
      await setPersistence(auth, browserSessionPersistence);
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      if (email === "mizutekuteacher@gmail.com") {
        window.location.href = "teacher.html";
        return;
      }

      const studentDoc = await getDoc(doc(db, "students", user.uid));
      if (studentDoc.exists() && studentDoc.data().verified) {
        window.location.href = "student.html";
      } else {
        alert("⏳ Your account is still waiting for teacher verification.");
      }
    } catch (err) {
      alert("❌ " + err.message);
    }
  }
}

// Attach handler
loginBtn.addEventListener("click", handleAuth);

// Enter Key Support
const inputs = [emailInput, passwordInput, confirmPasswordInput, lastnameInput, firstnameInput, middleinitialInput, sectionInput, gradeSelect];
inputs.forEach(input => {
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      handleAuth();
    }
  });
});

// Auto Redirect if Logged In
onAuthStateChanged(auth, async (user) => {
  if (user) {
    if (user.email === "mizutekuteacher@gmail.com") {
      window.location.href = "teacher.html";
    } else {
      const studentDoc = await getDoc(doc(db, "students", user.uid));
      if (studentDoc.exists() && studentDoc.data().verified) {
        window.location.href = "student.html";
      }
    }
  }
});

// Bubble Animation
function createBubble() {
  const bubble = document.createElement("div");
  bubble.classList.add("bubble");
  const size = Math.random() * 50 + 20;
  bubble.style.width = `${size}px`;
  bubble.style.height = `${size}px`;
  bubble.style.left = `${Math.random() * 100}%`;
  bubble.style.background = `rgba(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, 0.5)`;
  bubble.style.animationDuration = `${Math.random() * 5 + 5}s`;

  bubble.addEventListener("click", () => bubble.classList.add("pop"));
  bubble.addEventListener("animationend", () => bubble.remove());
  bgLayer.appendChild(bubble);
}
setInterval(createBubble, 400);

// Password Toggle
togglePassword.addEventListener("click", () => {
  const type = passwordInput.type === "password" ? "text" : "password";
  passwordInput.type = type;
  togglePassword.innerHTML = type === "password" ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
});

toggleConfirm.addEventListener("click", () => {
  const type = confirmPasswordInput.type === "password" ? "text" : "password";
  confirmPasswordInput.type = type;
  toggleConfirm.innerHTML = type === "password" ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
});
</script>
</body>
</html>
