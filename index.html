<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuTeku - Sign In / Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Chewy', sans-serif;
    background-color: #f8fbff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  /* MAIN CONTAINER FOR IMAGE + FORM */
  .main-container {
    display: flex;
    width: 900px;
    max-width: 95%;
    min-height: 500px; /* keeps it tall enough for Sign In image */
    transition: all 0.3s ease; /* smooth resizing */
    background: rgba(255, 255, 255, 0.95);
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  /* When in Sign Up mode, hide only the image side but keep container centered */
  .main-container.sign-up {
    max-height: 90%; /* let content decide height */
    height: auto; 
  }

  .main-container.sign-up .image-side {
    display: none;
  }

  .main-container.sign-up .form-side {
    flex: 1;
    width: 100%;
    padding: 2rem 2rem; /* optional padding */
  }

  /* IMAGE SECTION */
  .image-side {
    flex: 1;
    background-image: url('attached_assets/images/SignIn.png');
    background-size: cover;
    background-position: center;
  }

  .fa-eye, .fa-eye-slash {
    margin-bottom: 15px;
  }

  /* FORM SECTION */
  .form-side {
    flex: 1;
    padding: 2rem 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .form-side h2 {
    color: #3498db;
    margin-bottom: 0.5rem;
    font-size: 1.7rem;
    text-align: center;
  }

  .form-side p {
    font-size: 0.95rem;
    margin-bottom: 1rem;
    text-align: center;
  }

  .form-side input[type="text"],
  .form-side input[type="password"],
  .form-side input[type="email"],
  .form-side select {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border: 2px solid #3498db;
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
    transition: border 0.3s ease, box-shadow 0.3s ease;
    box-sizing: border-box;
  }

  .form-side input:focus,
  .form-side select:focus {
    border-color: #2ecc71;
    box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
  }

  .form-side button {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #3498db, #2ecc71);
    color: white;
    border: none;
    padding: 0.8rem;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
    margin-bottom: 0.8rem;
  }

  .form-side button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
  }

  .toggle-link {
    color: #3498db;
    cursor: pointer;
    font-weight: bold;
    text-decoration: underline;
  }

  .password-wrapper {
    position: relative; /* allows absolute positioning inside */
  }

  .password-wrapper input {
    width: 100%;
    padding: 0.8rem 2.5rem 0.8rem 0.8rem; /* extra right padding for the eye */
    font-size: 1rem;
    box-sizing: border-box;
  }

  .password-wrapper .toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%); /* always vertically centered */
    font-size: 1.2rem;
    color: #3498db;
    cursor: pointer;
    user-select: none;
  }

  /* Make multi-column rows for Sign Up */
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap; /* allow wrapping on small screens */
  }

  .row input, .row select {
    flex: 1;
    min-width: 100px; /* prevents inputs from shrinking too much */
  }

  /* Name row: last, first, M.I. */
  #nameRow input#lastnameInput { flex: 2; }
  #nameRow input#firstnameInput { flex: 2; }
  #nameRow input#middleinitialInput { flex: 1; }

  /* Grade + section row */
  #gradeRow select, #gradeRow input { flex: 1; }

  /* Password + confirm password row: side-by-side */
  .password-wrapper { flex: 1; }
  #confirmWrapper { display: flex; flex: 1; }

  /* MODAL */
  .modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
  }

  .modal-content {
    background: white;
    padding: 25px;
    border-radius: 12px;
    width: 320px;
    text-align: center;
  }

  .modal-content button {
    margin-top: 15px;
    background: #007bff;
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
  }

  .modal-content button:hover {
    background: #005ec7;
  }

  /* PASSWORD STRENGTH */
  .strength-bar {
    width: 100%;
    margin-top: 4px;
    height: 6px;
    background: #ddd;
    border-radius: 4px;
    position: relative;
  }

  #strengthFill {
    height: 100%;
    width: 0%;
    background: red;
    border-radius: 4px;
    transition: width 0.3s, background 0.3s;
  }

  #strengthText {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    color: #777;
    text-align: left;
  }

  /* RESPONSIVE */
  @media(max-width: 900px){
    .main-container {
      flex-direction: column;
      width: 90%;
      min-height: auto;
    }

    .image-side {
      height: 200px;
    }
  }
</style>
</head>
<body>

<div id="verifyModal" class="modal">
  <div class="modal-content">
    <h3>✅ Account Created!</h3>
    <p>Your verification request has been sent.<br>
    Please wait for approval.</p>
    <button id="closeVerifyModal">Okay</button>
  </div>
</div>

<div id="bgLayer"></div>

<div class="main-container">
  <!-- IMAGE SIDE -->
  <div class="image-side"></div>

  <!-- FORM SIDE -->
  <div class="form-side">
    <h2 id="formTitle">MizuTeku Sign In</h2>
    <p id="formDesc">Please enter your email and password:</p>

    <div class="row" id="roleRow" style="display: none;">
      <select id="roleSelect">
        <option value="" disabled selected>Select Role</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>
    </div>

    <div class="row" id="lrnRow" style="display: none;">
      <input type="text" id="lrnInput" placeholder="Student No. (12 digits)">
    </div>

    <div class="row" id="nameRow" style="display: none;">
      <input type="text" id="lastnameInput" placeholder="Last Name">
      <input type="text" id="firstnameInput" placeholder="First Name">
      <input type="text" id="middleinitialInput" placeholder="M.I.">
    </div>

    <div class="row" id="gradeRow" style="display: none;">
      <select id="gradeSelect">
          <option value="" disabled selected>Grade</option>
          <option value="11">Grade 11</option>
          <option value="12">Grade 12</option>
      </select>

      <select id="sectionSelect">
          <option value="" disabled selected>Select Section</option>
      </select>
    </div>

    <input type="email" id="emailInput" placeholder="Enter your email">

    <div class="row" id="passwordRow">
      <div class="password-wrapper">
        <input type="password" id="passwordInput" placeholder="Enter your password">
        <span class="toggle-password" id="togglePassword"><i class="fa-solid fa-eye"></i></span>
      </div>
      <div class="password-wrapper" id="confirmWrapper" style="display:none;">
        <input type="password" id="confirmPasswordInput" placeholder="Confirm your password">
        <span class="toggle-password" id="toggleConfirm"><i class="fa-solid fa-eye"></i></span>
      </div>
    </div>

    <div id="passwordStrength" class="strength-bar" style="display: none;">
      <div id="strengthFill"></div>
      <span id="strengthText">Password Strength</span>
    </div>

    <button id="saveUsername">Sign In</button>
    <p id="switchText">
      Don't have an account? <span class="toggle-link" id="toggleForm">Sign Up</span>
    </p>
  </div>
</div>
</body>
</html>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  setPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  setDoc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// --- Firebase Config ---
const firebaseConfig = {
  apiKey: "AIzaSyDMMt2XLZMsHftcdHnls2KrIqG-b2-eY0c",
  authDomain: "mizuteku-3a441.firebaseapp.com",
  projectId: "mizuteku-3a441",
  storageBucket: "mizuteku-3a441.firebasestorage.app",
  messagingSenderId: "473895456413",
  appId: "1:473895456413:web:1452ef7b9860908dd78e74",
  measurementId: "G-NTT38FCEKG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// --- Elements (guard for missing elements) ---
const toggleLink = document.getElementById("toggleForm");
const loginBtn = document.getElementById("saveUsername");
const formTitle = document.getElementById("formTitle");
const formDesc = document.getElementById("formDesc");

const confirmPasswordInput = document.getElementById("confirmPasswordInput");
const confirmWrapper = confirmPasswordInput ? confirmPasswordInput.parentElement : null;

const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const togglePassword = document.getElementById("togglePassword");
const toggleConfirm = document.getElementById("toggleConfirm");
const switchText = document.getElementById("switchText");

const roleRow = document.getElementById("roleRow");
const roleSelect = document.getElementById("roleSelect");

const lrnRow = document.getElementById("lrnRow");
const nameRow = document.getElementById("nameRow");
const gradeRow = document.getElementById("gradeRow");

const lrnInput = document.getElementById("lrnInput");
const lastnameInput = document.getElementById("lastnameInput");
const firstnameInput = document.getElementById("firstnameInput");
const middleinitialInput = document.getElementById("middleinitialInput");
const gradeSelect = document.getElementById("gradeSelect");
const sectionInput = document.getElementById("sectionSelect");

const verifyModal = document.getElementById("verifyModal");
const closeVerifyModalBtn = document.getElementById("closeVerifyModal");
if (closeVerifyModalBtn && verifyModal) closeVerifyModalBtn.onclick = () => (verifyModal.style.display = "none");

// Basic safety: ensure required DOM nodes exist
if (!loginBtn || !emailInput || !passwordInput || !roleSelect) {
  console.error("Essential DOM elements are missing. Check your HTML element IDs.");
}

// state
let isSignUpMode = false;

// --- Input filters (defensive checks) ---
if (lrnInput) lrnInput.addEventListener("input", () => lrnInput.value = lrnInput.value.replace(/\D/g, "").slice(0, 12));
if (firstnameInput) firstnameInput.addEventListener("input", () => firstnameInput.value = firstnameInput.value.replace(/[^A-Za-z\s-]/g, ""));
if (lastnameInput) lastnameInput.addEventListener("input", () => lastnameInput.value = lastnameInput.value.replace(/[^A-Za-z\s]/g, ""));
if (middleinitialInput) middleinitialInput.addEventListener("input", () => middleinitialInput.value = middleinitialInput.value.replace(/[^A-Za-z]/g, "").toUpperCase().slice(0, 1));
if (sectionInput) sectionInput.addEventListener("input", () => sectionInput.value = sectionInput.value.replace(/[^A-Za-z0-9\s-]/g, ""));

// Toggle Sign Up / Sign In
function attachToggleListener() {
  const newToggle = document.getElementById("toggleForm");
  if (newToggle) {
    newToggle.addEventListener("click", (e) => {
      e.preventDefault();
      toggleSignUpMode();
    });
  }
}

function toggleSignUpMode() {
  isSignUpMode = !isSignUpMode;

  if (formTitle) formTitle.textContent = isSignUpMode ? "MizuTeku Sign Up" : "MizuTeku Sign In";
  if (formDesc) formDesc.textContent = isSignUpMode ? "Create an account:" : "Please enter your credentials:";
  if (loginBtn) loginBtn.textContent = isSignUpMode ? "Create Account" : "Sign In";
  if (confirmWrapper) confirmWrapper.style.display = isSignUpMode ? "flex" : "none";
  if (roleRow) roleRow.style.display = isSignUpMode ? "flex" : "none";

  const strengthContainer = document.getElementById("passwordStrength");
  if (strengthContainer) strengthContainer.style.display = isSignUpMode ? "block" : "none";

  if (isSignUpMode) {
    if (roleSelect) roleSelect.value = "student";
    if (lrnRow) lrnRow.style.display = "flex";
    if (nameRow) nameRow.style.display = "flex";
    if (gradeRow) gradeRow.style.display = "flex";
    if (loginBtn) loginBtn.style.marginTop = "30px";
    if (switchText) switchText.innerHTML = "Already have an account? <span class='toggle-link' id='toggleForm'>Sign In</span>";
  } else {
    if (lrnRow) lrnRow.style.display = "none";
    if (nameRow) nameRow.style.display = "none";
    if (gradeRow) gradeRow.style.display = "none";
    if (loginBtn) loginBtn.style.marginTop = "0";
    if (switchText) switchText.innerHTML = "Don't have an account? <span class='toggle-link' id='toggleForm'>Sign Up</span>";
  }

  // Toggle main container class for image
  const mainContainer = document.querySelector(".main-container");
  if (mainContainer) {
    if (isSignUpMode) mainContainer.classList.add("sign-up");
    else mainContainer.classList.remove("sign-up");
  }

  // Reattach listener to the new toggle span
  attachToggleListener();
}

// Initial toggle setup
if (toggleLink) {
  toggleLink.addEventListener("click", (e) => {
    e.preventDefault();
    toggleSignUpMode();
  });
}

// Role-specific UI
if (roleSelect) {
  roleSelect.addEventListener("change", () => {
    const role = roleSelect.value;
    if (role === "student") {
      if (lrnRow) lrnRow.style.display = "flex";
      if (nameRow) nameRow.style.display = "flex";
      if (gradeRow) gradeRow.style.display = "flex";
      if (gradeSelect && gradeSelect.options.length > 0) gradeSelect.options[0].textContent = "Grade (1-3)";
      if (sectionInput) sectionInput.placeholder = "Section (e.g. Diamond)";
    } else if (role === "teacher") {
      if (lrnRow) lrnRow.style.display = "none";
      if (nameRow) nameRow.style.display = "flex";
      if (gradeRow) gradeRow.style.display = "flex";
      if (gradeSelect && gradeSelect.options.length > 0) gradeSelect.options[0].textContent = "Advisory Grade";
      if (sectionInput) sectionInput.placeholder = "Advisory Section";
    }
  });
}

// Utility: clear custom validity before validating
function clearValidity(...els) {
  els.forEach(el => { if (el) el.setCustomValidity(""); });
}

// --- Main Auth Handler ---
async function handleAuth(e) {
  if (e && e.preventDefault) e.preventDefault();
  // ensure inputs exist
  if (!emailInput || !passwordInput) return;

  // clear previous errors
  clearValidity(emailInput, passwordInput, confirmPasswordInput, lrnInput);

  try {
    if (isSignUpMode) {
      // ---------- SIGN UP ----------
      if (!roleSelect) throw new Error("Role selection missing");

      const role = roleSelect.value;

      // --- TEACHER SIGN UP ---
      if (role === "teacher") {
        if (!lastnameInput?.value || !firstnameInput?.value || !gradeSelect?.value || !sectionInput?.value) {
          alert("Please fill all teacher information.");
          return;
        }
        if (!confirmPasswordInput) return alert("Confirm password field missing.");
        if (passwordInput.value !== confirmPasswordInput.value) {
          confirmPasswordInput.setCustomValidity("Passwords do not match.");
          confirmPasswordInput.reportValidity();
          return;
        }

        const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        // Save a verification request for teacher (use setDoc to keep doc id = uid)
        await setDoc(doc(db, "teacherVerificationRequests", userCredential.user.uid), {
          teacherId: userCredential.user.uid,
          lastName: lastnameInput.value.trim(),
          firstName: firstnameInput.value.trim(),
          middleInitial: middleinitialInput?.value?.trim() || "",
          advisoryGrade: gradeSelect.value,
          advisorySection: sectionInput.value.trim(),
          email: emailInput.value.trim(),
          status: "pending",
          requestedAt: serverTimestamp()
        });

        if (verifyModal) verifyModal.style.display = "flex";
        return;
      }

      // --- STUDENT SIGN UP ---
      if (!/^[0-9]{11}$/.test(lrnInput?.value || "")) {
        if (lrnInput) {
          lrnInput.setCustomValidity("Student no. must be exactly 11 digits.");
          lrnInput.reportValidity();
        } else {
          alert("Student no. input missing.");
        }
        return;
      }

      if (!lastnameInput?.value || !firstnameInput?.value || !gradeSelect?.value || !sectionInput?.value) {
          alert("Please fill all student information.");
          return;
        }

      if (!confirmPasswordInput) return alert("Confirm password field missing.");
      if (passwordInput.value !== confirmPasswordInput.value) {
        confirmPasswordInput.setCustomValidity("Passwords do not match.");
        confirmPasswordInput.reportValidity();
        return;
      }

      const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);

      // add verification request
      await addDoc(collection(db, "verificationRequests"), {
        studentId: userCredential.user.uid,
        studentnum: lrnInput.value.trim(),
        lastName: lastnameInput?.value?.trim() || "",
        firstName: firstnameInput?.value?.trim() || "",
        middleInitial: middleinitialInput?.value?.trim() || "",
        grade: gradeSelect?.value || "",
        section: sectionInput?.value?.trim() || "",
        email: emailInput.value.trim(),
        status: "pending",
        requestedAt: serverTimestamp()
      });

      await setDoc(doc(db, "students", userCredential.user.uid), {
        studentId: userCredential.user.uid,
        studentnum: lrnInput.value.trim(),
        lastName: lastnameInput?.value?.trim() || "",
        firstName: firstnameInput?.value?.trim() || "",
        middleInitial: middleinitialInput?.value?.trim() || "",
        grade: gradeSelect?.value || "",
        section: sectionInput?.value?.trim() || "",
        email: emailInput.value.trim(),
        verified: false,
        createdAt: serverTimestamp(),
        lastLogin: serverTimestamp()
      });

      if (verifyModal) verifyModal.style.display = "flex";
      return;
    }

    // ---------- SIGN IN ----------
    // set persistence BEFORE signIn
    await setPersistence(auth, browserSessionPersistence);

    const credential = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
    const user = credential.user;

    // check teacher collection
    const teacherDocSnap = await getDoc(doc(db, "teacher", user.uid));
    if (teacherDocSnap.exists()) {
      if (teacherDocSnap.data().verified === true) {
        // approved teacher
        window.location.href = "teacher.html";
        return;
      } else {
        passwordInput.setCustomValidity("Your teacher account is still pending admin verification.");
        passwordInput.reportValidity();
        return;
      }
    }

    // check student collection
    const studentDocRef = doc(db, "students", user.uid);
    const studentDocSnap = await getDoc(studentDocRef);
    if (studentDocSnap.exists()) {
      if (studentDocSnap.data().verified === true) {
        // update lastLogin then redirect
        await updateDoc(studentDocRef, { lastLogin: serverTimestamp() });
        window.location.href = "student.html";
        return;
      } else {
        passwordInput.setCustomValidity("Your student account is still pending verification.");
        passwordInput.reportValidity();
        return;
      }
    }

    const adminDoc = await getDoc(doc(db, "admin", user.uid));
      if (adminDoc.exists()) {
          window.location.href = "admin.html"; // Redirect to admin dashboard
      } else {
          alert("You are not an admin.");
      }

    // not a recognized account
    passwordInput.setCustomValidity("Your account is not yet processed by admin.");
    passwordInput.reportValidity();

  } catch (err) {
    // generic error handling (show friendly message)
    console.error("Auth error:", err);
    const msg = err?.message || "Authentication failed. Please try again.";
    // show as validity if possible, else alert
    if (passwordInput) {
      passwordInput.setCustomValidity(msg);
      passwordInput.reportValidity();
    } else {
      alert(msg);
    }
  }
}

togglePassword.addEventListener("click", () => {
  const isHidden = passwordInput.type === "password";
  passwordInput.type = isHidden ? "text" : "password";

  // Toggle eye icon
  togglePassword.innerHTML = isHidden
    ? `<i class="fa-solid fa-eye-slash"></i>`
    : `<i class="fa-solid fa-eye"></i>`;
});

toggleConfirm.addEventListener("click", () => {
  const isHidden = confirmPasswordInput.type === "password";
  confirmPasswordInput.type = isHidden ? "text" : "password";

  // Toggle eye icon
  toggleConfirm.innerHTML = isHidden
    ? `<i class="fa-solid fa-eye-slash"></i>`
    : `<i class="fa-solid fa-eye"></i>`;
});

const strengthBar = document.getElementById("passwordStrength");
const strengthFill = document.getElementById("strengthFill");
const strengthText = document.getElementById("strengthText");

function evaluatePasswordStrength(password) {
  let score = 0;

  if (password.length >= 8) score++;            // length
  if (/[A-Z]/.test(password)) score++;         // uppercase
  if (/[0-9]/.test(password)) score++;         // number
  if (/[^A-Za-z0-9]/.test(password)) score++;  // special character

  // Update UI
  switch (score) {
    case 0:
    case 1:
      strengthFill.style.width = "25%";
      strengthFill.style.background = "red";
      strengthText.textContent = "Weak";
      break;

    case 2:
      strengthFill.style.width = "50%";
      strengthFill.style.background = "orange";
      strengthText.textContent = "Medium";
      break;

    case 3:
      strengthFill.style.width = "75%";
      strengthFill.style.background = "#f1c40f";
      strengthText.textContent = "Good";
      break;

    case 4:
      strengthFill.style.width = "100%";
      strengthFill.style.background = "green";
      strengthText.textContent = "Strong";
      break;
  }
}

passwordInput.addEventListener("input", () => {
  passwordInput.value = passwordInput.value.slice(0, 20);
  evaluatePasswordStrength(passwordInput.value);
});

loginBtn.addEventListener("click", handleAuth);
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    handleAuth();
  }
});

const grade11Sections = [
  "ABM101", "ABM102", "CULART101",
  "HUMSS101", "HUMSS102",
  "IT101", "IT102",
  "STEM101", "STEM102", "STEM103", "STEM104",
  "TOP101"
];

const grade12Sections = [
  "ABM201", "ABM202", "ABM203",
  "CULART201", "CULART202",
  "DIGI201",
  "HUMSS201", "HUMSS202", "HUMSS203",
  "IT201", "IT202", "IT203",
  "STEM201", "STEM202", "STEM203", "STEM204", "STEM205", "STEM206", "STEM207", "STEM208",
  "TOP201"
];

gradeSelect.addEventListener("change", function () {
    sectionSelect.innerHTML = `<option value="" disabled selected>Select Section</option>`;

    let sections = [];

    if (this.value === "11") {
        sections = grade11Sections;
    } else if (this.value === "12") {
        sections = grade12Sections;
    }

    sections.forEach(sec => {
        const option = document.createElement("option");
        option.value = sec;
        option.textContent = sec;
        sectionSelect.appendChild(option);
    });
});

</script>
