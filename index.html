<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuTeku - Sign In / Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Chewy', sans-serif;
    background-color: #f8fbff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  #bgLayer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    bottom: -100px;
    border-radius: 50%;
    opacity: 0.6;
    animation: rise linear infinite;
    cursor: pointer;
  }

  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0.6; }
    50% { opacity: 0.8; }
    100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
  }

  .bubble.pop { animation: pop 0.3s forwards !important; }

  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }

  .login-container {
    background: rgba(255, 255, 255, 0.95);
    padding: 2rem 2.5rem;
    border-radius: 25px;
    text-align: center;
    width: 420px;
    max-width: 90%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  .login-container h2 {
    color: #3498db;
    margin-bottom: 0.5rem;
    font-size: 1.7rem;
  }

  .login-container p {
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }

  .login-container input[type="text"],
  .login-container input[type="password"],
  .login-container input[type="email"],
  .login-container select {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border: 2px solid #3498db;
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
    transition: border 0.3s ease, box-shadow 0.3s ease;
    box-sizing: border-box;
  }

  .login-container input:focus,
  .login-container select:focus {
    border-color: #2ecc71;
    box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
  }

  .login-container button {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #3498db, #2ecc71);
    color: white;
    border: none;
    padding: 0.8rem;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
    margin-bottom: 0.8rem;
  }

  .login-container button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
  }

  .toggle-link {
    color: #3498db;
    cursor: pointer;
    font-weight: bold;
    text-decoration: underline;
  }

  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-wrapper input {
    width: 100%;
    padding-right: 2.8rem;
    height: 2.8rem;
  }

  .password-wrapper .toggle-password {
    position: absolute;
    right: 10px;
    top: 40%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 1.2rem;
    color: #3498db;
    user-select: none;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .row input, .row select { flex: 1; }

  #nameRow input#lastnameInput { flex: 2; }
  #nameRow input#firstnameInput { flex: 2; }
  #nameRow input#middleinitialInput { flex: 1; }

  #lrnRow, #nameRow, #gradeRow { display: none; }

  .modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

.modal-content {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 320px;
  text-align: center;
  animation: pop 0.3s ease;
}

@keyframes pop {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.modal-content button {
  margin-top: 15px;
  background: #007bff;
  border: none;
  color: white;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
}
.modal-content button:hover {
  background: #005ec7;
}
  
</style>
</head>
<body>
  <div id="verifyModal" class="modal">
    <div class="modal-content">
      <h3>✅ Account Created!</h3>
      <p>Your verification request has been sent.<br>
      Please wait for approval.</p>
      <button id="closeVerifyModal">Okay</button>
    </div>
  </div>

  <div id="bgLayer"></div>

  <div class="login-container">
    <h2 id="formTitle">MizuTeku Sign In</h2>
    <p id="formDesc">Please enter your email and password:</p>

    <!-- Sign Up Role Selection -->
    <div class="row" id="roleRow" style="display:none;">
      <select id="roleSelect">
        <option value="" disabled selected>Select Role</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>
    </div>

    <!-- STUDENT ONLY FIELD -->
    <div class="row" id="lrnRow" style="display:none;">
      <input type="text" id="lrnInput" placeholder="LRN (12 digits)">
    </div>

    <!-- SHARED NAME FIELDS -->
    <div class="row" id="nameRow" style="display:none;">
      <input type="text" id="lastnameInput" placeholder="Last Name">
      <input type="text" id="firstnameInput" placeholder="First Name">
      <input type="text" id="middleinitialInput" placeholder="M.I.">
    </div>

    <!-- SHARED ADVISORY / SECTION FIELDS -->
    <div class="row" id="gradeRow" style="display:none;">
    <select id="gradeSelect">
      <option value="" disabled selected>Grade</option>
      <option value="1">Grade 1</option>
      <option value="2">Grade 2</option>
      <option value="3">Grade 3</option>
    </select>
    <input type="text" id="sectionInput" placeholder="Section (Ex. Diamond)">
  </div>

    <!-- COMMON EMAIL -->
    <input type="email" id="emailInput" placeholder="Enter your email">

    <!-- PASSWORD -->
    <div class="password-wrapper">
      <input type="password" id="passwordInput" placeholder="Enter your password">
      <span class="toggle-password" id="togglePassword"><i class="fa-solid fa-eye"></i></span>
    </div>

    <!-- CONFIRM PASSWORD (SIGN UP ONLY) -->
    <div class="password-wrapper" id="confirmWrapper" style="display:none;">
      <input type="password" id="confirmPasswordInput" placeholder="Confirm your password">
      <span class="toggle-password" id="toggleConfirm"><i class="fa-solid fa-eye"></i></span>
    </div>

    <button id="saveUsername">Sign In</button>

    <p id="switchText">
      Don't have an account? <span class="toggle-link" id="toggleForm">Sign Up</span>
    </p>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, getDoc, setDoc, addDoc, updateDoc,
  query, where, orderBy, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// --- Firebase Config ---
const firebaseConfig = {
  apiKey: "AIzaSyDMMt2XLZMsHftcdHnls2KrIqG-b2-eY0c",
  authDomain: "mizuteku-3a441.firebaseapp.com",
  projectId: "mizuteku-3a441",
  storageBucket: "mizuteku-3a441.firebasestorage.app",
  messagingSenderId: "473895456413",
  appId: "1:473895456413:web:1452ef7b9860908dd78e74",
  measurementId: "G-NTT38FCEKG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// --- DOM Elements ---
const verificationTable = document.querySelector("#verificationTable tbody");
const verifiedTable = document.querySelector("#verifiedTable tbody");
const logContainer = document.querySelector("#logContainer");

const totalStudentsEl = document.getElementById("totalStudents");
const verifiedStudentsEl = document.getElementById("verifiedStudents");
const pendingStudentsEl = document.getElementById("pendingStudents");
const rejectedStudentsEl = document.getElementById("rejectedStudents");
const activeStudentsEl = document.getElementById("activeStudents");

// --- Logging Function ---
async function addLog(message, type = "info") {
  const teacherId = auth.currentUser?.uid;
  if (!teacherId) return;

  const timestamp = new Date().toLocaleString();

  // UI
  const p = document.createElement("p");
  p.textContent = `${timestamp}: ${message}`;
  if(type === "success") p.style.color = "green";
  if(type === "error") p.style.color = "red";
  if(type === "warning") p.style.color = "orange";

  const noLogs = document.getElementById("noLogs");
  if (noLogs) noLogs.remove();
  logContainer.prepend(p);
  logContainer.scrollTop = 0;

  // Firestore
  try {
    await addDoc(collection(db, "teacherLogs", teacherId, "logs"), {
      message,
      type,
      timestamp: serverTimestamp()
    });
  } catch(err) {
    console.error("Failed to save log:", err);
  }
}

// --- Load Teacher Logs ---
async function loadTeacherLogs() {
  const teacherId = auth.currentUser?.uid;
  if (!teacherId) return;

  logContainer.innerHTML = `<p>Loading logs...</p>`;

  try {
    const q = query(
      collection(db, "teacherLogs", teacherId, "logs"),
      orderBy("timestamp", "desc")
    );
    const snap = await getDocs(q);
    logContainer.innerHTML = "";

    if (snap.empty) {
      logContainer.innerHTML = `<p id="noLogs">No logs available at the moment.</p>`;
      return;
    }

    snap.forEach(docSnap => {
      const log = docSnap.data();
      const ts = log.timestamp?.toDate().toLocaleString() || "(no time)";
      const p = document.createElement("p");
      p.textContent = `${ts}: ${log.message}`;
      if(log.type === "success") p.style.color = "green";
      if(log.type === "error") p.style.color = "red";
      if(log.type === "warning") p.style.color = "orange";
      logContainer.appendChild(p);
    });

    logContainer.scrollTop = 0;
  } catch(err) {
    console.error("Failed to load logs:", err);
    logContainer.innerHTML = `<p id="noLogs">Failed to load logs.</p>`;
  }
}

// --- Dashboard Stats ---
async function updateDashboardStats(section) {
  try {
    const totalSnap = await getDocs(query(collection(db, "students"), where("section", "==", section)));
    const total = totalSnap.size;

    const verifiedSnap = await getDocs(query(collection(db, "students"), where("verified", "==", true), where("section", "==", section)));
    const verified = verifiedSnap.size;

    const pendingSnap = await getDocs(query(collection(db, "verificationRequests"), where("status", "==", "pending"), where("section", "==", section)));
    const pending = pendingSnap.size;

    const rejectedSnap = await getDocs(query(collection(db, "verificationRequests"), where("status", "==", "rejected"), where("section", "==", section)));
    const rejected = rejectedSnap.size;

    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
    const activeSnap = await getDocs(query(collection(db, "students"), where("section", "==", section), where("lastLogin", ">=", sevenDaysAgo)));
    const active = activeSnap.size;

    totalStudentsEl.textContent = total;
    verifiedStudentsEl.textContent = verified;
    pendingStudentsEl.textContent = pending;
    rejectedStudentsEl.textContent = rejected;
    activeStudentsEl.textContent = active;

  } catch(err) {
    console.error("Failed to update dashboard stats:", err);
  }
}

// --- Load Pending Verification ---
async function loadStudentsForVerification(section) {
  verificationTable.innerHTML = `<tr><td colspan="6" style="text-align:center;">Loading...</td></tr>`;
  const q = query(collection(db, "verificationRequests"), where("status", "==", "pending"), where("section", "==", section));
  const snapshot = await getDocs(q);

  if(snapshot.empty){
    verificationTable.innerHTML = `<tr><td colspan="6" style="text-align:center;">🎉 No pending verification requests!</td></tr>`;
    updateDashboardStats(section);
    return;
  }

  verificationTable.innerHTML = "";
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${data.firstName} ${data.middleInitial || ""}. ${data.lastName}</td>
      <td>${data.lrn || "N/A"}</td>
      <td>${data.grade || "N/A"}</td>
      <td>${data.section || "N/A"}</td>
      <td class="status">Pending</td>
      <td>
        <button class="verify-btn" data-id="${data.studentId}" data-req="${docSnap.id}">Verify</button>
        <button class="reject-btn" data-id="${data.studentId}" data-req="${docSnap.id}">Reject</button>
      </td>`;
    verificationTable.appendChild(row);
  });

  document.querySelectorAll(".verify-btn").forEach(btn => {
    btn.onclick = async () => {
      const studentId = btn.dataset.id;
      const requestId = btn.dataset.req;
      try {
        const requestSnap = await getDoc(doc(db, "verificationRequests", requestId));
        if(!requestSnap.exists()){ addLog("Request not found", "error"); return; }
        const data = requestSnap.data();
        await setDoc(doc(db, "students", studentId), {
          studentId,
          firstName: data.firstName,
          middleInitial: data.middleInitial,
          lastName: data.lastName,
          email: data.email,
          lrn: data.lrn || "",
          grade: data.grade || "",
          section: data.section || "",
          verified: true,
          createdAt: data.requestedAt || serverTimestamp(),
          verifiedAt: serverTimestamp()
        });
        await updateDoc(doc(db, "verificationRequests", requestId), { status: "approved" });
        addLog(`Student ${data.firstName} verified successfully.`, "success");
        loadStudentsForVerification(section);
        loadVerifiedStudents(section);
        updateDashboardStats(section);
      } catch(err){ console.error(err); addLog(`Failed to verify student: ${err.message}`, "error"); }
    };
  });

  document.querySelectorAll(".reject-btn").forEach(btn => {
    btn.onclick = async () => {
      const requestId = btn.dataset.req;
      try{
        const requestSnap = await getDoc(doc(db, "verificationRequests", requestId));
        const data = requestSnap.exists() ? requestSnap.data() : {};
        await updateDoc(doc(db, "verificationRequests", requestId), { status: "rejected" });
        addLog(`Rejected student verification for ${data.firstName || ""}.`, "warning");
        loadStudentsForVerification(section);
        updateDashboardStats(section);
      } catch(err){ console.error(err); addLog(`Failed to reject student request: ${err.message}`, "error"); }
    };
  });
}

// --- Load Verified Students ---
async function loadVerifiedStudents(section) {
  verifiedTable.innerHTML = `<tr><td colspan="7" style="text-align:center;">Loading...</td></tr>`;
  try{
    const q = query(collection(db, "students"), where("verified", "==", true), where("section", "==", section));
    const snapshot = await getDocs(q);
    verifiedTable.innerHTML = "";
    if(snapshot.empty){
      verifiedTable.innerHTML = `<tr><td colspan="7" style="text-align:center;">No verified students yet.</td></tr>`;
      return;
    }
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${data.firstName || ""}</td>
        <td>${data.middleInitial || ""}</td>
        <td>${data.lastName || ""}</td>
        <td>${data.email || ""}</td>
        <td>${data.lrn || "N/A"}</td>
        <td>${data.grade || "N/A"}</td>
        <td>${data.section || "N/A"}</td>`;
      verifiedTable.appendChild(row);
    });
  } catch(err){ console.error(err); verifiedTable.innerHTML = `<tr><td colspan="7" style="text-align:center;">Failed to load students.</td></tr>`;}
}

// --- Auth State ---
onAuthStateChanged(auth, async (user)=>{
  if(!user) return window.location.href = "index.html";

  const teacherDoc = await getDoc(doc(db, "teacher", user.uid));
  if(teacherDoc.exists() && teacherDoc.data().verified){
    const section = teacherDoc.data().advisorySection || "";
    loadStudentsForVerification(section);
    loadVerifiedStudents(section);
    loadTeacherLogs();
    updateDashboardStats(section);
    return;
  }

  window.location.href = "index.html";
});
</script>
</body>
</html>
