<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="icon" href="attached_assets/images/logo.png" type="image/x-icon">
    <link rel="shortcut icon" href="attached_assets/images/logo.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="attached_assets/images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to bottom right, #c9f1ff, #f2fcfe);
  margin: 0;
  padding: 0;
  color: #333;
}

header {
  background: linear-gradient(to right, #00b4db, #0083b0);
  color: white;
  text-align: center;
  padding: 1.5rem 0;
  font-size: 1.8rem;
  font-weight: 600;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
}

.dashboard {
  max-width: 900px;
  margin: 40px auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  padding: 30px 25px;
}

.dashboard h2 {
  text-align: center;
  margin-bottom: 25px;
  color: #0083b0;
  font-weight: 700;
}

.student-list {
  width: 100%;
  border-collapse: collapse;
  border-radius: 12px;
  overflow: hidden;
}

.student-list th, .student-list td {
  padding: 14px 16px;
  text-align: left;
}

.student-list th {
  background: #00b4db;
  color: white;
  font-weight: 600;
  font-size: 1rem;
  letter-spacing: 0.5px;
}

.student-list tr:nth-child(even) {
  background: #f9f9f9;
}

.student-list tr:hover {
  background: #e8f8ff;
  transition: 0.3s;
}

.status {
  font-weight: 600;
  color: #ff9f00;
}

.verified {
  color: #28a745;
  font-weight: bold;
}

.verify-btn {
  background: linear-gradient(to right, #00b4db, #0083b0);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.3s ease;
}

.verify-btn:hover {
  background: linear-gradient(to right, #009ac1, #007095);
  transform: translateY(-2px);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
}

@media (max-width: 600px) {
  header {
    font-size: 1.4rem;
    padding: 1rem;
  }

  .dashboard {
    margin: 15px;
    padding: 15px;
  }

  .student-list th, .student-list td {
    font-size: 14px;
    padding: 10px;
  }

  .verify-btn {
    padding: 6px 10px;
    font-size: 13px;
  }
}
</style>
</head>
<body>
  <header>
    <h1>Teacher Dashboard</h1>
    <button id="clearDataBtn" class="signout-btn">Sign Out</button>
  </header>

  <div class="dashboard">
    <h2>Students for Verification</h2>

    <table class="student-list">
      <thead>
        <tr>
          <th>Name</th>
          <th>Grade</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="studentTable">
        <tr>
          <td colspan="4" style="text-align:center;">Loading students...</td>
        </tr>
      </tbody>
    </table>
  </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="modal">
      <div class="modal-content">
        <h2 id="confirmModalTitle">Are you sure?</h2>
        <p id="confirmModalMessage">Do you want to proceed?</p>
        <div class="modal-buttons">
          <button id="confirmYesBtn" class="yes-btn">Yes</button>
          <button id="confirmNoBtn" class="no-btn">No</button>
        </div>
      </div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAlert()">&times;</span>
            <h2 id="alertModalTitle"></h2>
            <p id="alertModalMessage"></p>
        </div>
    </div>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
    getFirestore, 
    collection, 
    getDocs, 
    query, 
    where, 
    updateDoc, 
    doc, 
    deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- Firebase Config ---
    const firebaseConfig = {
    apiKey: "AIzaSyDMMt2XLZMsHftcdHnls2KrIqG-b2-eY0c",
    authDomain: "mizuteku-3a441.firebaseapp.com",
    projectId: "mizuteku-3a441",
    storageBucket: "mizuteku-3a441.firebasestorage.app",
    messagingSenderId: "473895456413",
    appId: "1:473895456413:web:1452ef7b9860908dd78e74",
    measurementId: "G-NTT38FCEKG",
    };

    // --- Initialize Firebase ---
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- DOM Elements ---
    const studentList = document.getElementById("studentList");
    const signOutBtn = document.getElementById("clearDataBtn");

    // --- Custom Modals ---
    function showAlertModal(title = "", message = "", callback = null) {
    const modal = document.getElementById("alertModal");
    if (!modal) return;
    modal.querySelector("#alertModalTitle").innerText = title;
    modal.querySelector("#alertModalMessage").innerText = message;
    modal.classList.remove("hidden");
    modal._callback = callback;
    }

    function closeAlertModal() {
    const modal = document.getElementById("alertModal");
    if (!modal) return;
    modal.classList.add("hidden");
    if (typeof modal._callback === "function") modal._callback();
    modal._callback = null;
    }

    function showConfirmModal(title, message, onConfirm, onCancel) {
    const modal = document.getElementById("confirmModal");
    if (!modal) return;
    modal.querySelector("#confirmModalTitle").innerText = title;
    modal.querySelector("#confirmModalMessage").innerText = message;
    modal.style.display = "flex";

    const yesBtn = modal.querySelector("#confirmYesBtn");
    const noBtn = modal.querySelector("#confirmNoBtn");

    yesBtn.onclick = () => {
        modal.style.display = "none";
        if (onConfirm) onConfirm();
    };
    noBtn.onclick = () => {
        modal.style.display = "none";
        if (onCancel) onCancel();
    };
    }

    // --- Load Verification Requests ---
    async function loadStudents() {
    if (!studentList) return;

    studentList.innerHTML = "Loading verification requests...";
    
    // Load all pending verification requests
    const q = query(collection(db, "verificationRequests"), where("status", "==", "pending"))
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
        studentList.innerHTML = "<li>🎉 No pending verification requests!</li>";
        return;
    }

    studentList.innerHTML = "";
    snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const li = document.createElement("li");
        li.innerHTML = `
        <div class="student-item">
            <span>${data.firstName} ${data.middleInitial}. ${data.lastName}</span>
            <div class="buttons">
            <button class="verifyBtn" data-id="${data.studentId}" data-req="${docSnap.id}">✅ Verify</button>
            <button class="rejectBtn" data-id="${data.studentId}" data-req="${docSnap.id}">❌ Reject</button>
            </div>
        </div>
        `;
        studentList.appendChild(li);
    });

    // --- Verify Student ---
    document.querySelectorAll(".verifyBtn").forEach((btn) => {
        btn.addEventListener("click", () => {
        const studentId = btn.dataset.id;
        const requestId = btn.dataset.req;
        showConfirmModal(
            "Verify Student?",
            "Are you sure you want to verify this student?",
            async () => {
            try {
                // Update student as verified
                await updateDoc(doc(db, "students", studentId), { verified: true });
                // Mark verification request as approved
                await updateDoc(doc(db, "verificationRequests", requestId), { status: "approved" });
                showAlertModal("✅ Verified", "Student has been verified successfully.", loadStudents);
            } catch (err) {
                console.error(err);
                showAlertModal("❌ Error", "Failed to verify student. Please try again.");
            }
            }
        );
        });
    });

    // --- Reject Student ---
    document.querySelectorAll(".rejectBtn").forEach((btn) => {
        btn.addEventListener("click", () => {
        const studentId = btn.dataset.id;
        const requestId = btn.dataset.req;
        showConfirmModal(
            "Reject Student?",
            "Do you want to reject this student's request?",
            async () => {
            try {
                // Delete both records (or mark as rejected)
                await updateDoc(doc(db, "verificationRequests", requestId), { status: "rejected" });
                await deleteDoc(doc(db, "students", studentId));
                showAlertModal("❌ Rejected", "Student's request has been removed.", loadStudents);
            } catch (err) {
                console.error(err);
                showAlertModal("❌ Error", "Failed to reject student. Please try again.");
            }
            }
        );
        });
    });
    }

    // --- Sign Out ---
    if (signOutBtn) {
    signOutBtn.addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "index.html";
    });
    }

    // --- Page Protection & Auto Load ---
    onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "index.html"; // Not logged in
        return;
    }

    if (user.email === "mizutekuteacher@gmail.com") {
        loadStudents(); // Only teacher can access
    } else {
        window.location.href = "index.html"; // Block others
    }
    });
</script>
</body>
</html>
