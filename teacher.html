<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="icon" href="attached_assets/images/logo.png" type="image/x-icon">
    <link rel="shortcut icon" href="attached_assets/images/logo.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="attached_assets/images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="attached_assets/images/logo_text2.png" alt="Logo">
            </div>
            <ul class="nav-menu">
                <li><a href="#home" data-en="Home" data-tl="Tahanan">Home</a></li>
                <li><a href="#clean-water" data-en="Why" data-tl="Bakit">Why</a></li>
                <li><a href="#handwashing" data-en="Handwashing" data-tl="Hugas Kamay">Handwashing</a></li>
                <li><a href="#games" data-en="Games" data-tl="Mga Laro">Games</a></li>
                <li><a href="#resources" data-en="Resources" data-tl="Mga Liham">Resources</a></li>
                <li><a href="#about_us" data-en="About Us" data-tl="Tungkol sa Amin">About Us</a></li>
            </ul>
            <div class="nav-controls">
                <button id="lang-en" class="lang-btn active">EN</button>
                <button id="lang-tl" class="lang-btn">TL</button>
                <button id="clearDataBtn" class="clear-btn">Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="modal">
      <div class="modal-content">
        <h2 id="confirmModalTitle">Are you sure?</h2>
        <p id="confirmModalMessage">Do you want to proceed?</p>
        <div class="modal-buttons">
          <button id="confirmYesBtn" class="yes-btn">Yes</button>
          <button id="confirmNoBtn" class="no-btn">No</button>
        </div>
      </div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAlert()">&times;</span>
            <h2 id="alertModalTitle"></h2>
            <p id="alertModalMessage"></p>
        </div>
    </div>

    <!-- Teacher Page -->
    <div id="teacherPage">
        <h2>👩‍🏫 Teacher Dashboard</h2>
        <p>Pending student verifications:</p>
        <ul id="studentList"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyDMMt2XLZMsHftcdHnls2KrIqG-b2-eY0c",
            authDomain: "mizuteku-3a441.firebaseapp.com",
            projectId: "mizuteku-3a441",
            storageBucket: "mizuteku-3a441.firebasestorage.app",
            messagingSenderId: "473895456413",
            appId: "1:473895456413:web:1452ef7b9860908dd78e74",
            measurementId: "G-NTT38FCEKG",
        };

        // --- Initialize Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DOM Elements ---
        const studentList = document.getElementById("studentList");
        const signOutBtn = document.getElementById("clearDataBtn");

        // --- Custom Modals ---
        function showAlertModal(title = "", message = "", callback = null) {
            const modal = document.getElementById("alertModal");
            if (!modal) return;
            modal.querySelector("#alertModalTitle").innerText = title;
            modal.querySelector("#alertModalMessage").innerText = message;
            modal.classList.remove("hidden");
            modal._callback = callback;
        }

        function closeAlertModal() {
            const modal = document.getElementById("alertModal");
            if (!modal) return;
            modal.classList.add("hidden");
            if (typeof modal._callback === "function") modal._callback();
            modal._callback = null;
        }

        function showConfirmModal(title, message, onConfirm, onCancel) {
            const modal = document.getElementById("confirmModal");
            if (!modal) return;
            modal.querySelector("#confirmModalTitle").innerText = title;
            modal.querySelector("#confirmModalMessage").innerText = message;
            modal.style.display = "flex";

            const yesBtn = modal.querySelector("#confirmYesBtn");
            const noBtn = modal.querySelector("#confirmNoBtn");

            yesBtn.onclick = () => {
                modal.style.display = "none";
                if (onConfirm) onConfirm();
            };
            noBtn.onclick = () => {
                modal.style.display = "none";
                if (onCancel) onCancel();
            };
        }

        // --- Load unverified students ---
        async function loadStudents() {
            if (!studentList) return;

            studentList.innerHTML = "Loading students...";
            const q = query(collection(db, "students"), where("verified", "==", false));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                studentList.innerHTML = "<li>🎉 All students are verified!</li>";
                return;
            }

            studentList.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const li = document.createElement("li");
                li.innerHTML = `
                    ${data.firstName} ${data.lastName} (${data.middleInitial})
                    <button class="verifyBtn" data-id="${docSnap.id}">Verify</button>
                `;
                studentList.appendChild(li);
            });

            document.querySelectorAll(".verifyBtn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const uid = btn.dataset.id;
                    showConfirmModal(
                        "Verify Student?",
                        `Do you want to verify ${btn.parentElement.textContent.trim()}?`,
                        async () => {
                            try {
                                await updateDoc(doc(db, "students", uid), { verified: true });
                                showAlertModal("✅ Verified", `${btn.parentElement.textContent.trim()} is now verified`, loadStudents);
                            } catch (err) {
                                console.error("❌ Failed to verify student:", err);
                                showAlertModal("❌ Error", "Failed to verify student. Please try again.");
                            }
                        }
                    );
                });
            });
        }

        // --- Sign Out Handler ---
        if (signOutBtn) {
            signOutBtn.addEventListener("click", () => {
                showConfirmModal(
                    "Sign Out?",
                    "Do you really want to sign out of your account?",
                    async () => {
                        try {
                            await signOut(auth);
                            localStorage.removeItem("rememberedEmail");
                            showAlertModal("✅ Signed out", "Redirecting to login...", () => {
                                window.location.href = "index.html";
                            });
                        } catch (err) {
                            console.error("❌ Sign out failed:", err);
                            showAlertModal("❌ Error", "Failed to sign out. Please try again.");
                        }
                    }
                );
            });
        }

        // --- Page protection & auto-load ---
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html"; // Not logged in
                return;
            }

            if (user.email === "mizutekuteacher@gmail.com") {
                loadStudents(); // Teacher loads students
            } else {
                window.location.href = "index.html"; // Non-teacher access blocked
            }
        });
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
