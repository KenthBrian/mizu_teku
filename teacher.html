<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="icon" href="attached_assets/images/logo.png" type="image/x-icon">
    <link rel="shortcut icon" href="attached_assets/images/logo.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="attached_assets/images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="attached_assets/images/logo_text2.png" alt="Logo">
            </div>
            <ul class="nav-menu">
                <li><a href="#home" data-en="Home" data-tl="Tahanan">Home</a></li>
                <li><a href="#clean-water" data-en="Why" data-tl="Bakit">Why</a></li>
                <li><a href="#handwashing" data-en="Handwashing" data-tl="Hugas Kamay">Handwashing</a></li>
                <li><a href="#games" data-en="Games" data-tl="Mga Laro">Games</a></li>
                <li><a href="#resources" data-en="Resources" data-tl="Mga Liham">Resources</a></li>
                <li><a href="#about_us" data-en="About Us" data-tl="Tungkol sa Amin">About Us</a></li>
            </ul>
            <div class="nav-controls">
                <button id="lang-en" class="lang-btn active">EN</button>
                <button id="lang-tl" class="lang-btn">TL</button>
                <button id="clearDataBtn" class="clear-btn">Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Teacher Page -->
    <div id="teacherPage">
        <h2>👩‍🏫 Teacher Dashboard</h2>
        <p>Pending student verifications:</p>
        <ul id="studentList"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyDMMt2XLZMsHftcdHnls2KrIqG-b2-eY0c",
            authDomain: "mizuteku-3a441.firebaseapp.com",
            projectId: "mizuteku-3a441",
            storageBucket: "mizuteku-3a441.firebasestorage.app",
            messagingSenderId: "473895456413",
            appId: "1:473895456413:web:1452ef7b9860908dd78e74",
            measurementId: "G-NTT38FCEKG",
        };

        // --- Initialize Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DOM Elements ---
        const studentList = document.getElementById("studentList");
        const signOutBtn = document.getElementById("clearDataBtn");

        // --- Load unverified students ---
        async function loadStudents() {
            if (!studentList) return;

            studentList.innerHTML = "Loading students...";
            const q = query(collection(db, "students"), where("verified", "==", false));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                studentList.innerHTML = "<li>🎉 All students are verified!</li>";
                return;
            }

            studentList.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const li = document.createElement("li");
                li.innerHTML = `
                    ${data.firstName} ${data.lastName} (${data.middleInitial})
                    <button class="verifyBtn" data-id="${docSnap.id}">Verify</button>
                `;
                studentList.appendChild(li);
            });

            document.querySelectorAll(".verifyBtn").forEach((btn) => {
                btn.addEventListener("click", async () => {
                    const uid = btn.dataset.id;
                    try {
                        await updateDoc(doc(db, "students", uid), { verified: true });
                        alert(`✅ Verified ${btn.parentElement.textContent.trim()}`);
                        loadStudents();
                    } catch (err) {
                        console.error("❌ Failed to verify student:", err);
                        alert("❌ Failed to verify student. Try again.");
                    }
                });
            });
        }

        // --- Sign Out Handler ---
        if (signOutBtn) {
            signOutBtn.addEventListener("click", async () => {
                const confirmed = confirm("Do you really want to sign out?");
                if (!confirmed) return;

                try {
                    await signOut(auth);
                    localStorage.removeItem("rememberedEmail");
                    alert("✅ Signed out successfully!");
                    window.location.href = "index.html";
                } catch (err) {
                    console.error("❌ Sign out failed:", err);
                    alert("❌ Failed to sign out. Please try again.");
                }
            });
        }

        // --- Page protection & auto-load ---
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Not logged in, redirect
                window.location.href = "index.html";
                return;
            }

            if (user.email === "mizutekuteacher@gmail.com") {
                // Teacher account, load students
                loadStudents();
            } else {
                // Non-teacher trying to access, redirect
                window.location.href = "index.html";
            }
        });
        </script>
    <script type="module" src="script.js"></script>
</body>
</html>
